<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 540px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #f8f9fa;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .header-row h2 { font-size: 18px; color: #111; }
    .cam-select-box { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .cam-select-box select { flex: 1; padding: 6px 8px; font-size: 13px; border: 1.5px solid #0969da; border-radius: 6px; background: #fff; }

    #reader-wrapper {
      position: relative;
      width: 100%;
      height: 30vh;
      min-height: 150px;
      max-height: 32vh;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }
    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      transition: transform 0.25s ease-out;
      transform-origin: center center;
    }
    .focus-ring { position: absolute; width: 50px; height: 50px; border: 2px solid #2da44e; border-radius: 6px; pointer-events: none; transform: translate(-50%, -50%) scale(1.4); opacity: 0; transition: transform 0.2s, opacity 0.2s; z-index: 10; }
    .focus-ring.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .camera-tools { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 6px 0; padding: 4px 8px; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; flex-shrink: 0; }
    .camera-tools span { font-size: 12px; font-weight: 600; color: #444; }
    .zoom-btns { display: flex; gap: 4px; }
    .zoom-btns button { padding: 4px 8px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .zoom-btns button.active { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }

    .room-box { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; padding: 4px 8px; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; font-size: 12px; flex-shrink: 0; }
    .room-box input { flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; font-family: monospace; font-weight: bold; }
    .room-btn { padding: 4px 6px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; background: #f6f8fa; cursor: pointer; }

    .btn-row { display: flex; gap: 6px; margin-bottom: 5px; flex-shrink: 0; }
    button.action-btn { flex: 1; padding: 7px 4px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 500; }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }
    button.success { background: #2da44e; color: #fff; border-color: #2c974b; font-weight: bold; }
    button.danger-outline { color: #cf222e; border-color: #cf222e; }
    button.danger { background: #cf222e; color: #fff; border-color: #a40e26; font-weight: bold; }
    button.del-btn { flex: none; padding: 3px 8px; font-size: 11px; color: #cf222e; border: 1px solid #cf222e; border-radius: 4px; background: #fff; }

    .list-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px; font-size: 13px; font-weight: 600; color: #333; flex-shrink: 0; }
    .status { font-size: 12px; min-height: 18px; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; margin-bottom: 4px; }

    #list-container {
      flex: 1;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 0 8px;
      margin-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #eee;
      font-family: monospace;
      font-size: 13px;
      transition: background-color 0.3s;
    }
    li.duplicate-item {
      background-color: #fff8e5;
      border-left: 4px solid #f0883e;
      border-radius: 4px;
      margin: 2px 0;
    }
    .code-info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; word-break: break-all; }
    .badge-dup {
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid #ff8182;
      border-radius: 4px;
      font-size: 10px;
      padding: 2px 6px;
      font-weight: bold;
    }
    .btn-dedup {
      font-size: 11px;
      color: #d1242f;
      background: transparent;
      border: 1px solid #d1242f;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h2>Quét Barcode</h2>
    <small style="color:#888;">v1.8-secure</small>
  </div>

  <div class="cam-select-box">
    <label for="cameraSelect" style="font-size:12px;font-weight:600;">📷 Cam:</label>
    <select id="cameraSelect" onchange="onCameraChange(this.value)">
      <option value="">Đang tải danh sách...</option>
    </select>
  </div>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div id="focusRing" class="focus-ring"></div>
  </div>

  <div class="camera-tools">
    <span>Zoom:</span>
    <div class="zoom-btns" id="zoomButtons">
      <button type="button" onclick="setZoom(1, this)">1x</button>
      <button type="button" onclick="setZoom(1.5, this)">1.5x</button>
      <button type="button" class="active" onclick="setZoom(2, this)">2x</button>
      <button type="button" onclick="setZoom(3, this)">3x</button>
    </div>
    <button type="button" onclick="triggerRefocus()" style="flex:none;padding:4px 8px;font-size:11px;border-radius:4px;border:1px solid #ccc;background:#fff;">Lấy nét</button>
  </div>

  <div class="room-box">
    <label for="roomInput"><b>Kênh:</b></label>
    <input type="text" id="roomInput" placeholder="Mã kênh bảo mật...">
    <button type="button" class="room-btn" onclick="copyChannel()" title="Sao chép tên kênh">Copy</button>
    <button type="button" class="room-btn" onclick="generateNewChannel()" title="Tạo mã kênh ngẫu nhiên mới">Mới</button>
  </div>

  <div class="btn-row">
    <button class="action-btn primary" id="btnSend">Gửi Cloud</button>
    <button class="action-btn" id="btnFetch">Lấy mã</button>
    <button class="action-btn success" id="btnExport">Tải TXT</button>
  </div>
  <div class="btn-row">
    <button class="action-btn danger-outline" id="btnClearLocal">Xóa máy này</button>
    <button class="action-btn danger" id="btnClearCloud">Xóa trên Cloud</button>
  </div>

  <div class="list-header">
    <span id="summaryText">Danh sách mã</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="countText">Tổng: <b>0</b></span>
      <button class="btn-dedup" id="btnDedup" style="display:none;" onclick="removeDuplicates()">Lọc trùng</button>
    </div>
  </div>
  <div class="status" id="statusText">Trạng thái: Đang kết nối...</div>

  <div id="list-container">
    <ul id="list"></ul>
  </div>

  <script>
    // ponytail: Zero innerHTML interpolation on untrusted code input + cryptographically secure room token generation.
    const MAX_ITEMS = 5000;
    const MAX_CODE_LEN = 256;
    let codes = [];

    const listEl = document.getElementById('list');
    const countText = document.getElementById('countText');
    const btnDedup = document.getElementById('btnDedup');
    const statusEl = document.getElementById('statusText');
    const roomInput = document.getElementById('roomInput');
    const cameraSelect = document.getElementById('cameraSelect');
    const focusRing = document.getElementById('focusRing');
    const readerWrapper = document.getElementById('reader-wrapper');
    let html5QrCode = null;
    let videoTrack = null;
    let eventSource = null;
    let audioCtx = null;
    let isStarting = false;
    let currentZoom = 2;

    // Hiển thị trạng thái an toàn tuyệt đối (không inject HTML từ input người dùng)
    function showStatus(text, color = '#444') {
      statusEl.textContent = text;
      statusEl.style.color = color;
      statusEl.style.fontWeight = color === '#444' ? 'normal' : 'bold';
    }

    // Làm sạch chuỗi barcode chống tấn công chèn ký tự điều khiển
    function sanitizeCode(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[\x00-\x1F\x7F]/g, '').trim().slice(0, MAX_CODE_LEN);
    }

    // Khởi tạo mã kênh ngẫu nhiên bảo mật 16 byte hex (không thể đoán mò)
    function generateSecureChannelName() {
      const randBytes = new Uint8Array(8);
      crypto.getRandomValues(randBytes);
      const hex = Array.from(randBytes).map(b => b.toString(16).padStart(2, '0')).join('');
      return `enscen-bc-${hex}`;
    }

    function initChannel() {
      let saved = localStorage.getItem('secure_channel_id');
      if (!saved || saved.trim() === 'enscen-barcode') {
        saved = generateSecureChannelName();
        localStorage.setItem('secure_channel_id', saved);
      }
      roomInput.value = saved;
    }

    function generateNewChannel() {
      if (!confirm('Tạo mã kênh bí mật mới? Bạn sẽ cần nhập mã này sang thiết bị còn lại.')) return;
      const newChan = generateSecureChannelName();
      roomInput.value = newChan;
      localStorage.setItem('secure_channel_id', newChan);
      connectSSE();
      fetchFromChannel();
      showStatus(`Đã đổi sang kênh bảo mật mới.`, '#0969da');
    }

    function copyChannel() {
      navigator.clipboard.writeText(roomInput.value.trim()).then(() => {
        showStatus('Đã sao chép mã kênh vào bộ nhớ tạm!', '#1a7f37');
      }).catch(() => {
        alert('Mã kênh của bạn: ' + roomInput.value.trim());
      });
    }

    function getTopic() {
      const val = (roomInput.value.trim() || 'enscen-barcode').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
      return val || 'enscen-barcode';
    }

    function playTone(freq, duration, gainVal) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.value = gainVal || 0.15;
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function playSuccessBeep() { playTone(950, 0.08, 0.15); }
    function playWarningBeep() {
      playTone(320, 0.1, 0.2);
      setTimeout(() => playTone(260, 0.12, 0.2), 120);
    }

    async function setZoom(val, btnEl) {
      currentZoom = val;
      document.querySelectorAll('.zoom-btns button').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      const video = document.querySelector('#reader video');
      const caps = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        try {
          const target = Math.min(Math.max(val, caps.zoom.min), caps.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
          if (video) video.style.transform = 'none';
          showStatus(`Zoom phần cứng: ${target}x`);
          return;
        } catch (_) {}
      }

      if (video) {
        video.style.transform = val > 1 ? `scale(${val})` : 'none';
        showStatus(`Zoom kỹ thuật số: ${val}x`);
      }
    }

    async function triggerRefocus(e) {
      if (e && e.clientX) {
        const rect = readerWrapper.getBoundingClientRect();
        focusRing.style.left = `${e.clientX - rect.left}px`;
        focusRing.style.top = `${e.clientY - rect.top}px`;
        focusRing.classList.add('active');
        setTimeout(() => focusRing.classList.remove('active'), 500);
      }

      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.focusMode) {
        try {
          if (caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          }
          if (caps.focusMode.includes('continuous')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
          showStatus('Đã lấy nét lại.');
        } catch (_) {}
      }
    }

    readerWrapper.addEventListener('click', triggerRefocus);

    function hookVideoTrack() {
      const video = document.querySelector('#reader video');
      if (video && video.srcObject) {
        const [track] = video.srcObject.getVideoTracks();
        if (track) {
          videoTrack = track;
          setTimeout(() => {
            const btn2x = document.querySelector('.zoom-btns button:nth-child(3)');
            setZoom(2.0, btn2x);
          }, 400);
        }
      }
    }

    function flashExistingItem(codeText) {
      const items = listEl.querySelectorAll('li');
      items.forEach(li => {
        if (li.dataset.code === codeText) {
          li.style.backgroundColor = '#ffdce0';
          li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          setTimeout(() => { li.style.backgroundColor = ''; }, 1400);
        }
      });
    }

    let lastScanTime = 0;
    function onScanSuccess(rawDecodedText) {
      const now = Date.now();
      if (now - lastScanTime < 1200) return;
      lastScanTime = now;

      const decodedText = sanitizeCode(rawDecodedText);
      if (!decodedText) return;

      if (codes.includes(decodedText)) {
        playWarningBeep();
        if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
        showStatus(`⚠️ ĐÃ CÓ: [${decodedText}] (Không thêm lại)`, '#cf222e');
        flashExistingItem(decodedText);
        return;
      }

      if (codes.length >= MAX_ITEMS) {
        alert('Đã đạt giới hạn tối đa 5000 mã.');
        return;
      }

      codes.push(decodedText);
      renderList();
      playSuccessBeep();
      if (navigator.vibrate) navigator.vibrate(80);
      showStatus(`✅ Đã thêm: ${decodedText}`, '#1a7f37');
    }

    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    async function stopActiveStreams() {
      if (videoTrack) {
        try { videoTrack.stop(); } catch (_) {}
        videoTrack = null;
      }
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
        } catch (_) {}
      }
      document.querySelectorAll('#reader video').forEach(v => {
        if (v.srcObject) {
          try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (_) {}
          v.srcObject = null;
        }
      });
    }

    async function startScanner(cameraId) {
      if (isStarting) return;
      isStarting = true;
      showStatus('Đang chuyển đổi camera...');

      await stopActiveStreams();

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader", {
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            formatsToSupport: formatsToSupport
          });
        }

        const cameraConfig = cameraId
          ? { deviceId: { exact: cameraId } }
          : { facingMode: "environment" };

        await html5QrCode.start(
          cameraConfig,
          {
            fps: 20,
            qrbox: (w, h) => ({
              width: Math.floor(Math.min(w * 0.88, 360)),
              height: Math.floor(Math.min(h * 0.6, 140))
            }),
            aspectRatio: 1.777778
          },
          onScanSuccess,
          () => {}
        );

        showStatus('Camera sẵn sàng.');
        hookVideoTrack();
      } catch (err) {
        showStatus('Lỗi camera: ' + (err.message || err), '#cf222e');
      } finally {
        isStarting = false;
      }
    }

    async function onCameraChange(cameraId) {
      if (!cameraId) return;
      localStorage.setItem('preferred_camera_id', cameraId);
      await startScanner(cameraId);
    }

    async function initCameraList() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());

        const devices = await Html5Qrcode.getCameras();
        cameraSelect.innerHTML = '';
        if (!devices || !devices.length) {
          cameraSelect.innerHTML = '<option value="">Không tìm thấy camera</option>';
          await startScanner(null);
          return;
        }

        const savedId = localStorage.getItem('preferred_camera_id');
        let selectedId = devices[0].id;

        devices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.id;
          opt.textContent = dev.label || `Camera ${idx + 1}`;
          cameraSelect.appendChild(opt);

          const lbl = (dev.label || '').toLowerCase();
          if (lbl.includes('back') || lbl.includes('sau') || lbl.includes('zxhy') || lbl.includes('environment')) {
            selectedId = dev.id;
          }
        });

        if (savedId && devices.some(d => d.id === savedId)) {
          selectedId = savedId;
        }

        cameraSelect.value = selectedId;
        await startScanner(selectedId);
      } catch (err) {
        cameraSelect.innerHTML = '<option value="">Camera mặc định</option>';
        await startScanner(null);
      }
    }

    // Render danh sách bằng DOM API an toàn 100% (chống XSS)
    function renderList() {
      const freq = {};
      codes.forEach(c => freq[c] = (freq[c] || 0) + 1);

      let duplicateCount = 0;
      Object.values(freq).forEach(count => {
        if (count > 1) duplicateCount += (count - 1);
      });

      countText.innerHTML = '';
      const totalSpan = document.createElement('span');
      totalSpan.textContent = `Tổng: ${codes.length}`;
      countText.appendChild(totalSpan);

      if (duplicateCount > 0) {
        const dupBadge = document.createElement('span');
        dupBadge.style.color = '#d1242f';
        dupBadge.style.fontWeight = 'bold';
        dupBadge.style.marginLeft = '4px';
        dupBadge.textContent = `(${duplicateCount} trùng)`;
        countText.appendChild(dupBadge);
      }

      btnDedup.style.display = duplicateCount > 0 ? 'inline-block' : 'none';
      listEl.innerHTML = '';

      codes.slice().reverse().forEach((code, reversedIdx) => {
        const originalIdx = codes.length - 1 - reversedIdx;
        const isDup = freq[code] > 1;

        const li = document.createElement('li');
        li.dataset.code = code;
        if (isDup) li.className = 'duplicate-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'code-info';

        const indexB = document.createElement('b');
        indexB.textContent = `#${originalIdx + 1} `;

        const codeSpan = document.createElement('span');
        codeSpan.textContent = code; // Sử dụng textContent chống DOM-XSS

        infoDiv.appendChild(indexB);
        infoDiv.appendChild(codeSpan);

        if (isDup) {
          const dupSpan = document.createElement('span');
          dupSpan.className = 'badge-dup';
          dupSpan.textContent = `Trùng (${freq[code]}x)`;
          infoDiv.appendChild(dupSpan);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = 'Xóa';
        delBtn.onclick = () => removeCode(originalIdx);

        li.appendChild(infoDiv);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function removeCode(index) {
      codes.splice(index, 1);
      renderList();
    }

    function removeDuplicates() {
      if (!confirm('Lọc trùng: Chỉ giữ 1 bản sao duy nhất cho mỗi mã?')) return;
      codes = [...new Set(codes)];
      renderList();
      showStatus('Đã lọc sạch các mã trùng lặp!', '#1a7f37');
    }

    document.getElementById('btnSend').onclick = async () => {
      if (!codes.length) return alert('Chưa có mã nào để gửi.');
      const topic = getTopic();
      showStatus('Đang gửi lên Cloud...');
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: codes.join('\n')
        });
        if (res.ok) {
          showStatus(`Đã gửi ${codes.length} mã lên kênh an toàn.`, '#1a7f37');
        } else {
          showStatus('Gửi thất bại, thử lại sau.', '#cf222e');
        }
      } catch (e) {
        showStatus(`Lỗi mạng: ${e.message}`, '#cf222e');
      }
    };

    async function fetchFromChannel() {
      const topic = getTopic();
      showStatus('Đang lấy dữ liệu từ kênh...');
      try {
        const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1`);
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split('\n').filter(Boolean);
          let latestMsg = null;
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const parsed = JSON.parse(lines[i]);
              if (parsed.event === 'message' && typeof parsed.message === 'string') {
                latestMsg = parsed.message;
                break;
              }
            } catch (_) {}
          }

          if (latestMsg === '__CLEAR__' || !latestMsg) {
            codes = [];
            renderList();
            showStatus('Kênh Cloud hiện đang trống.');
          } else {
            codes = latestMsg
              .split('\n')
              .map(s => sanitizeCode(s))
              .filter(Boolean)
              .slice(0, MAX_ITEMS);
            renderList();
            showStatus(`Đã nhận ${codes.length} mã từ kênh.`, '#1a7f37');
          }
        }
      } catch (e) {
        showStatus('Chưa thể lấy dữ liệu từ kênh.', '#cf222e');
      }
    }

    document.getElementById('btnClearCloud').onclick = async () => {
      const topic = getTopic();
      if (!confirm(`Xóa dữ liệu trên Cloud cho kênh này?\n(Các thiết bị khác đang kết nối kênh này cũng sẽ xóa danh sách)`)) return;
      showStatus('Đang xóa dữ liệu trên Cloud...');
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: '__CLEAR__'
        });
        if (res.ok) {
          codes = [];
          renderList();
          showStatus('Đã xóa sạch dữ liệu trên kênh Cloud.', '#1a7f37');
        } else {
          showStatus('Không thể xóa, thử lại sau.', '#cf222e');
        }
      } catch (e) {
        showStatus(`Lỗi mạng: ${e.message}`, '#cf222e');
      }
    };

    document.getElementById('btnClearLocal').onclick = () => {
      if (!confirm('Xóa danh sách trên máy này? (Không ảnh hưởng đến Cloud)')) return;
      codes = [];
      renderList();
      showStatus('Đã xóa danh sách trên máy này.');
    };

    function connectSSE() {
      if (eventSource) eventSource.close();
      const topic = getTopic();
      eventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      eventSource.onopen = () => {
        showStatus(`Đã kết nối kênh bảo mật.`);
      };
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && typeof data.message === 'string') {
            if (data.message === '__CLEAR__') {
              codes = [];
              renderList();
              showStatus('Kênh đã được xóa bởi thiết bị khác.');
              return;
            }
            codes = data.message
              .split('\n')
              .map(s => sanitizeCode(s))
              .filter(Boolean)
              .slice(0, MAX_ITEMS);
            renderList();
            showStatus(`Nhận dữ liệu mới (${codes.length} mã)`, '#1a7f37');
          }
        } catch (_) {}
      };
      eventSource.onerror = () => {
        showStatus('Mất kết nối realtime, bấm "Lấy mã" để tải lại.', '#b54708');
      };
    }

    roomInput.onchange = () => {
      localStorage.setItem('secure_channel_id', roomInput.value.trim());
      connectSSE();
      fetchFromChannel();
    };

    document.getElementById('btnFetch').onclick = fetchFromChannel;

    document.getElementById('btnExport').onclick = () => {
      if (!codes.length) return alert('Chưa có mã nào');
      const blob = new Blob([codes.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `barcodes_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    initChannel();
    initCameraList();
    fetchFromChannel();
    connectSSE();
  </script>
</body>
</html>
