<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 0 auto; padding: 12px; }
    #reader-wrapper { position: relative; width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    #reader { width: 100%; }
    .focus-ring { position: absolute; width: 60px; height: 60px; border: 2px solid #2da44e; border-radius: 8px; pointer-events: none; transform: translate(-50%, -50%) scale(1.4); opacity: 0; transition: transform 0.2s, opacity 0.2s; }
    .focus-ring.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .camera-tools { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 10px; padding: 6px 10px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; }
    .camera-tools span { font-size: 13px; font-weight: 600; color: #333; }
    .zoom-btns { display: flex; gap: 4px; }
    .zoom-btns button { padding: 4px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .zoom-btns button.active { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    button { flex: 1 1 calc(50% - 8px); padding: 11px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 500; }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }
    button.success { background: #2da44e; color: #fff; border-color: #2c974b; font-weight: bold; }
    button.danger { background: #cf222e; color: #fff; border-color: #a40e26; }
    button.del-btn { flex: none; padding: 4px 8px; font-size: 12px; color: #cf222e; border: 1px solid #cf222e; border-radius: 4px; background: transparent; }
    .room-box { display: flex; align-items: center; gap: 8px; margin: 10px 0; padding: 8px 12px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; }
    .room-box input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
    .status { font-size: 13px; color: #555; padding: 4px 0; min-height: 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Quét Barcode</h2>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div id="focusRing" class="focus-ring"></div>
  </div>

  <div class="camera-tools">
    <span>Thu phóng:</span>
    <div class="zoom-btns" id="zoomButtons">
      <button type="button" onclick="setZoom(1, this)">1x</button>
      <button type="button" onclick="setZoom(1.5, this)">1.5x</button>
      <button type="button" class="active" onclick="setZoom(2, this)">2x (Khuyên dùng)</button>
      <button type="button" onclick="setZoom(3, this)">3x</button>
    </div>
    <button type="button" onclick="triggerRefocus()" style="flex:none;padding:4px 8px;font-size:12px;">Chạm lấy nét</button>
  </div>

  <div class="room-box">
    <label for="roomInput"><b>Mã kênh:</b></label>
    <input type="text" id="roomInput" value="enscen-barcode">
  </div>

  <p>Tổng: <b id="count">0</b> mã</p>
  <div class="status" id="statusText">Trạng thái: Đang kết nối kênh...</div>

  <div class="btn-row">
    <button class="primary" id="btnSend">Gửi sang thiết bị khác</button>
    <button id="btnFetch">Nhận mã mới nhất</button>
    <button class="success" id="btnExport">Tải file TXT</button>
    <button class="danger" id="btnClear">Xóa tất cả</button>
  </div>

  <ul id="list"></ul>

  <script>
    // ponytail: hardware zoom & continuous focus via MediaStreamTrack capabilities.
    let codes = [];
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('statusText');
    const roomInput = document.getElementById('roomInput');
    const focusRing = document.getElementById('focusRing');
    const readerWrapper = document.getElementById('reader-wrapper');
    let videoTrack = null;
    let eventSource = null;
    let audioCtx = null;

    function playBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 950;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (_) {}
    }

    async function setZoom(val, btnEl) {
      if (!videoTrack) return;
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.zoom) {
          const target = Math.min(Math.max(val, caps.zoom.min), caps.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
          document.querySelectorAll('.zoom-btns button').forEach(b => b.classList.remove('active'));
          if (btnEl) btnEl.classList.add('active');
        }
      } catch (_) {}
    }

    async function triggerRefocus(e) {
      if (!videoTrack) return;
      if (e) {
        const rect = readerWrapper.getBoundingClientRect();
        focusRing.style.left = `${e.clientX - rect.left}px`;
        focusRing.style.top = `${e.clientY - rect.top}px`;
        focusRing.classList.add('active');
        setTimeout(() => focusRing.classList.remove('active'), 500);
      }
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.focusMode) {
          if (caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          }
          if (caps.focusMode.includes('continuous')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
        }
      } catch (_) {}
    }

    readerWrapper.addEventListener('click', triggerRefocus);

    // Bắt track camera khi video khởi động
    const observer = new MutationObserver(() => {
      const video = document.querySelector('#reader video');
      if (video && video.srcObject && !videoTrack) {
        const [track] = video.srcObject.getVideoTracks();
        if (track) {
          videoTrack = track;
          // Tự động kích hoạt zoom 2x và lấy nét liên tục sau khi camera mở
          setTimeout(() => {
            setZoom(2.0, document.querySelector('.zoom-btns button:nth-child(3)'));
            triggerRefocus();
          }, 600);
        }
      }
    });
    observer.observe(document.getElementById('reader'), { childList: true, subtree: true });

    function getTopic() {
      return (roomInput.value.trim() || 'enscen-barcode').replace(/[^a-zA-Z0-9_-]/g, '');
    }

    function renderList() {
      countEl.textContent = codes.length;
      listEl.innerHTML = '';
      codes.forEach((code, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${idx + 1}. ${code}</span>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = 'Xóa';
        delBtn.onclick = () => removeCode(idx);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function removeCode(index) {
      codes.splice(index, 1);
      renderList();
    }

    let lastScanTime = 0;
    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (codes[codes.length - 1] === decodedText && (now - lastScanTime < 2000)) return;
      lastScanTime = now;
      codes.push(decodedText);
      renderList();
      playBeep();
      if (navigator.vibrate) navigator.vibrate(80);
    }

    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    const scanner = new Html5QrcodeScanner('reader', {
      fps: 20,
      qrbox: (w, h) => ({
        width: Math.floor(Math.min(w * 0.88, 380)),
        height: Math.floor(Math.min(h * 0.45, 180))
      }),
      aspectRatio: 1.777778,
      showTorchButtonIfSupported: true,
      videoConstraints: {
        facingMode: { ideal: "environment" },
        width: { min: 1280, ideal: 1920 },
        height: { min: 720, ideal: 1080 }
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      formatsToSupport: formatsToSupport
    });
    scanner.render(onScanSuccess);

    document.getElementById('btnSend').onclick = async () => {
      if (!codes.length) return alert('Chưa có mã nào để gửi.');
      const topic = getTopic();
      statusEl.textContent = 'Đang gửi...';
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: codes.join('\n')
        });
        if (res.ok) {
          statusEl.textContent = `Đã gửi thành công lên kênh [${topic}]`;
        } else {
          statusEl.textContent = 'Gửi thất bại, thử lại sau.';
        }
      } catch (e) {
        statusEl.textContent = `Lỗi mạng: ${e.message}`;
      }
    };

    async function fetchFromChannel() {
      const topic = getTopic();
      statusEl.textContent = `Đang lấy dữ liệu từ kênh [${topic}]...`;
      try {
        const res = await fetch(`https://ntfy.sh/${topic}/raw?poll=1`);
        if (res.ok) {
          const text = await res.text();
          if (text.trim()) {
            codes = text.split('\n').map(s => s.trim()).filter(Boolean);
            renderList();
            statusEl.textContent = `Đã nhận ${codes.length} mã từ kênh [${topic}].`;
          } else {
            statusEl.textContent = 'Kênh chưa có mã nào.';
          }
        }
      } catch (e) {
        statusEl.textContent = 'Chưa thể lấy dữ liệu từ kênh.';
      }
    }

    function connectSSE() {
      if (eventSource) eventSource.close();
      const topic = getTopic();
      eventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      eventSource.onopen = () => {
        statusEl.textContent = `Đã kết nối kênh [${topic}]. Sẵn sàng đồng bộ.`;
      };
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && data.message) {
            codes = data.message.split('\n').map(s => s.trim()).filter(Boolean);
            renderList();
            statusEl.textContent = `Nhận dữ liệu mới (${codes.length} mã)`;
          }
        } catch (_) {}
      };
      eventSource.onerror = () => {
        statusEl.textContent = 'Mất kết nối kênh thời gian thực, bấm "Nhận mã" để tải lại.';
      };
    }

    roomInput.onchange = () => {
      connectSSE();
      fetchFromChannel();
    };

    document.getElementById('btnFetch').onclick = fetchFromChannel;

    document.getElementById('btnExport').onclick = () => {
      if (!codes.length) return alert('Chưa có mã nào');
      const blob = new Blob([codes.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `barcodes_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById('btnClear').onclick = () => {
      if (!confirm('Xóa toàn bộ danh sách hiện tại?')) return;
      codes = [];
      renderList();
    };

    fetchFromChannel();
    connectSSE();
  </script>
</body>
</html>
