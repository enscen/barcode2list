<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --bg-card-sub: #f6f8fa;
      --text-main: #111111;
      --text-muted: #666666;
      --border-color: #e1e4e8;
      --item-border: #eeeeee;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --btn-bg: #ffffff;
      --btn-text: #24292f;
      --dup-bg: #fff8e5;
      --dup-border: #f0883e;
      --badge-dup-bg: #ffebe9;
      --badge-dup-text: #cf222e;
      --badge-dup-border: #ff8182;
    }
    body.dark-theme {
      --bg-body: #0d1117;
      --bg-card: #161b22;
      --bg-card-sub: #21262d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --item-border: #21262d;
      --input-bg: #0d1117;
      --input-border: #30363d;
      --btn-bg: #21262d;
      --btn-text: #c9d1d9;
      --dup-bg: #2b2210;
      --dup-border: #d29922;
      --badge-dup-bg: #3d1b1f;
      --badge-dup-text: #ff7b72;
      --badge-dup-border: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 540px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-body);
      color: var(--text-main);
      transition: background-color 0.2s, color 0.2s;
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .header-row h2 { font-size: 18px; color: var(--text-main); }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .hdr-btn {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
    }

    .cam-select-box { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .cam-select-box select { flex: 1; padding: 6px 8px; font-size: 13px; border: 1.5px solid #0969da; border-radius: 6px; background: var(--input-bg); color: var(--text-main); }

    #reader-wrapper {
      position: relative;
      width: 100%;
      height: 30vh;
      min-height: 150px;
      max-height: 32vh;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }
    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      transition: transform 0.25s ease-out;
      transform-origin: center center;
    }
    .focus-ring { position: absolute; width: 50px; height: 50px; border: 2px solid #2da44e; border-radius: 6px; pointer-events: none; transform: translate(-50%, -50%) scale(1.4); opacity: 0; transition: transform 0.2s, opacity 0.2s; z-index: 10; }
    .focus-ring.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .camera-tools { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 6px 0; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; flex-shrink: 0; }
    .camera-tools span { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .zoom-btns { display: flex; gap: 4px; }
    .zoom-btns button { padding: 4px 8px; font-size: 11px; border: 1px solid var(--input-border); border-radius: 4px; background: var(--btn-bg); color: var(--text-main); cursor: pointer; }
    .zoom-btns button.active { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }

    .room-box { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; font-size: 12px; flex-shrink: 0; }
    .room-box input { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--input-border); border-radius: 4px; font-size: 11px; font-family: monospace; font-weight: bold; background: var(--input-bg); color: var(--text-main); }
    .room-btn { flex: none; white-space: nowrap; padding: 4px 6px; font-size: 11px; border: 1px solid var(--input-border); border-radius: 4px; background: var(--bg-card-sub); color: var(--text-main); cursor: pointer; }

    .btn-row { display: flex; gap: 6px; margin-bottom: 5px; flex-shrink: 0; }
    button.action-btn { flex: 1; padding: 7px 4px; font-size: 12px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; font-weight: 500; }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }
    button.success { background: #2da44e; color: #fff; border-color: #2c974b; font-weight: bold; }
    button.danger-outline { color: #cf222e; border-color: #cf222e; }
    button.danger { background: #cf222e; color: #fff; border-color: #a40e26; font-weight: bold; }
    button.del-btn { flex: none; padding: 3px 8px; font-size: 11px; color: #cf222e; border: 1px solid #cf222e; border-radius: 4px; background: var(--bg-card); cursor: pointer; }

    .list-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px; font-size: 13px; font-weight: 600; color: var(--text-main); flex-shrink: 0; }
    .status { font-size: 12px; min-height: 18px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; margin-bottom: 4px; }

    #list-container {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0 8px;
      margin-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid var(--item-border);
      font-family: monospace;
      font-size: 13px;
      color: var(--text-main);
      transition: background-color 0.3s;
    }
    li.duplicate-item {
      background-color: var(--dup-bg);
      border-left: 4px solid var(--dup-border);
      border-radius: 4px;
      margin: 2px 0;
    }
    .code-info { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; word-break: break-all; }
    .badge-dup {
      background: var(--badge-dup-bg);
      color: var(--badge-dup-text);
      border: 1px solid var(--badge-dup-border);
      border-radius: 4px;
      font-size: 10px;
      padding: 2px 6px;
      font-weight: bold;
    }
    .btn-dedup {
      font-size: 11px;
      color: #d1242f;
      background: transparent;
      border: 1px solid #d1242f;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h2 id="titleText">Quét Barcode</h2>
    <div class="header-actions">
      <button type="button" id="themeToggleBtn" class="hdr-btn" onclick="toggleTheme()" title="Đổi giao diện Sáng / Tối">🌙</button>
      <button type="button" id="langToggleBtn" class="hdr-btn" onclick="toggleLang()" title="Chuyển đổi Ngôn ngữ">EN</button>
      <small style="color:var(--text-muted);font-size:11px;">v1.9-secure</small>
    </div>
  </div>

  <div class="cam-select-box">
    <label for="cameraSelect" id="camLabel" style="font-size:12px;font-weight:600;">📷 Cam:</label>
    <select id="cameraSelect" onchange="onCameraChange(this.value)">
      <option value="">...</option>
    </select>
  </div>

  <div id="reader-wrapper">
    <div id="reader"></div>
    <div id="focusRing" class="focus-ring"></div>
  </div>

  <div class="camera-tools">
    <span id="zoomLabel">Zoom:</span>
    <div class="zoom-btns" id="zoomButtons">
      <button type="button" onclick="setZoom(1, this)">1x</button>
      <button type="button" onclick="setZoom(1.5, this)">1.5x</button>
      <button type="button" class="active" onclick="setZoom(2, this)">2x</button>
      <button type="button" onclick="setZoom(3, this)">3x</button>
    </div>
    <button type="button" id="focusBtn" onclick="triggerRefocus()" style="flex:none;padding:4px 8px;font-size:11px;border-radius:4px;border:1px solid var(--input-border);background:var(--btn-bg);color:var(--text-main);">Lấy nét</button>
  </div>

  <div class="room-box">
    <label for="roomInput"><b id="chanLabel">Kênh:</b></label>
    <input type="text" id="roomInput" placeholder="...">
    <button type="button" class="room-btn" id="copyBtn" onclick="copyChannel()">Sao chép</button>
    <button type="button" class="room-btn" id="newChanBtn" onclick="generateNewChannel()">Mới</button>
  </div>

  <div class="btn-row">
    <button class="action-btn primary" id="btnSend">Gửi Cloud</button>
    <button class="action-btn" id="btnFetch">Lấy mã</button>
    <button class="action-btn success" id="btnExport">Tải TXT</button>
  </div>
  <div class="btn-row">
    <button class="action-btn danger-outline" id="btnClearLocal">Xóa máy này</button>
    <button class="action-btn danger" id="btnClearCloud">Xóa trên Cloud</button>
  </div>

  <div class="list-header">
    <span id="summaryText">Danh sách mã</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="countText">Tổng: <b>0</b></span>
      <button class="btn-dedup" id="btnDedup" style="display:none;" onclick="removeDuplicates()">Lọc trùng</button>
    </div>
  </div>
  <div class="status" id="statusText">Trạng thái: Đang kết nối...</div>

  <div id="list-container">
    <ul id="list"></ul>
  </div>

  <script>
    // ponytail: I18N dictionary + CSS variable theme switching.
    const I18N = {
      vi: {
        title: "Quét Barcode",
        camLabel: "📷 Cam:",
        zoomLabel: "Zoom:",
        focusBtn: "Lấy nét",
        chanLabel: "Kênh:",
        copyBtn: "Sao chép",
        newChanBtn: "Mới",
        btnSend: "Gửi Cloud",
        btnFetch: "Lấy mã",
        btnExport: "Tải TXT",
        btnClearLocal: "Xóa máy này",
        btnClearCloud: "Xóa trên Cloud",
        summaryText: "Danh sách mã",
        totalPrefix: "Tổng:",
        dupSuffix: "trùng",
        dupBadge: "Trùng",
        btnDedup: "Lọc trùng",
        delBtn: "Xóa",
        camReady: "Camera sẵn sàng.",
        camSwitching: "Đang chuyển đổi camera...",
        camError: "Lỗi camera: ",
        connecting: "Đang kết nối...",
        connectedSec: "Đã kết nối kênh bảo mật.",
        copyDone: "Đã sao chép mã kênh!",
        newChanPrompt: "Tạo mã kênh bảo mật mới? Bạn cần nhập mã này sang thiết bị còn lại.",
        newChanDone: "Đã đổi sang kênh bảo mật mới.",
        clearCloudPrompt: (t) => `Xóa dữ liệu trên Cloud cho kênh [${t}]?\n(Các thiết bị khác cũng sẽ bị xóa)`,
        clearLocalPrompt: "Xóa danh sách trên máy này? (Không ảnh hưởng đến Cloud)",
        dedupPrompt: "Lọc trùng: Chỉ giữ 1 bản sao duy nhất cho mỗi mã?",
        dedupDone: "Đã lọc sạch các mã trùng lặp!",
        noCodes: "Chưa có mã nào",
        noCodesSend: "Chưa có mã nào để gửi.",
        sending: "Đang gửi lên Cloud...",
        sendSuccess: (n, t) => `Đã gửi ${n} mã lên kênh an toàn.`,
        sendFail: "Gửi thất bại, thử lại sau.",
        fetching: "Đang lấy dữ liệu từ kênh...",
        chanEmpty: "Kênh Cloud hiện đang trống.",
        receivedCodes: (n) => `Đã nhận ${n} mã từ kênh.`,
        wipedRemote: "Kênh đã được xóa bởi thiết bị khác.",
        clearedCloud: "Đã xóa sạch dữ liệu trên kênh Cloud.",
        clearedLocal: "Đã xóa danh sách trên máy này.",
        maxLimit: "Đã đạt giới hạn tối đa 5000 mã.",
        dupFound: (c) => `⚠️ ĐÃ CÓ: [${c}] (Không thêm lại)`,
        addedCode: (c) => `✅ Đã thêm: ${c}`,
        refocused: "Đã lấy nét lại.",
        lostNet: "Mất kết nối realtime, bấm 'Lấy mã' để tải lại."
      },
      en: {
        title: "Barcode Scanner",
        camLabel: "📷 Cam:",
        zoomLabel: "Zoom:",
        focusBtn: "Refocus",
        chanLabel: "Channel:",
        copyBtn: "Copy",
        newChanBtn: "New",
        btnSend: "Send Cloud",
        btnFetch: "Get Codes",
        btnExport: "Export TXT",
        btnClearLocal: "Clear Local",
        btnClearCloud: "Clear Cloud",
        summaryText: "Scanned List",
        totalPrefix: "Total:",
        dupSuffix: "dups",
        dupBadge: "Dup",
        btnDedup: "Deduplicate",
        delBtn: "Delete",
        camReady: "Camera ready.",
        camSwitching: "Switching camera...",
        camError: "Camera error: ",
        connecting: "Connecting...",
        connectedSec: "Connected to secure channel.",
        copyDone: "Channel ID copied to clipboard!",
        newChanPrompt: "Create new secure channel ID? You will need to enter this on other devices.",
        newChanDone: "Switched to new secure channel.",
        clearCloudPrompt: (t) => `Clear Cloud data for channel [${t}]?\n(Other devices will also be wiped)`,
        clearLocalPrompt: "Clear local list on this device? (Cloud won't be affected)",
        dedupPrompt: "Keep only 1 unique instance per barcode?",
        dedupDone: "Deduplicated successfully!",
        noCodes: "No barcodes yet",
        noCodesSend: "No barcodes to send.",
        sending: "Sending to Cloud...",
        sendSuccess: (n, t) => `Sent ${n} codes to secure channel.`,
        sendFail: "Send failed, try again.",
        fetching: "Fetching data from channel...",
        chanEmpty: "Cloud channel is currently empty.",
        receivedCodes: (n) => `Received ${n} codes from channel.`,
        wipedRemote: "Channel was wiped by another device.",
        clearedCloud: "Cloud data cleared successfully.",
        clearedLocal: "Local list cleared on this device.",
        maxLimit: "Max limit of 5000 barcodes reached.",
        dupFound: (c) => `⚠️ ALREADY EXISTS: [${c}] (Skipped)`,
        addedCode: (c) => `✅ Added: ${c}`,
        refocused: "Refocused.",
        lostNet: "Realtime lost. Click 'Get Codes' to retry."
      }
    };

    let currentLang = localStorage.getItem('app_lang') || 'vi';
    let currentTheme = localStorage.getItem('app_theme') || 'light';

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('app_theme', theme);
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('themeToggleBtn').textContent = '☀️';
      } else {
        document.body.classList.remove('dark-theme');
        document.getElementById('themeToggleBtn').textContent = '🌙';
      }
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    }

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      const t = I18N[lang];

      document.getElementById('titleText').textContent = t.title;
      document.getElementById('camLabel').textContent = t.camLabel;
      document.getElementById('zoomLabel').textContent = t.zoomLabel;
      document.getElementById('focusBtn').textContent = t.focusBtn;
      document.getElementById('chanLabel').textContent = t.chanLabel;
      document.getElementById('copyBtn').textContent = t.copyBtn;
      document.getElementById('newChanBtn').textContent = t.newChanBtn;
      document.getElementById('btnSend').textContent = t.btnSend;
      document.getElementById('btnFetch').textContent = t.btnFetch;
      document.getElementById('btnExport').textContent = t.btnExport;
      document.getElementById('btnClearLocal').textContent = t.btnClearLocal;
      document.getElementById('btnClearCloud').textContent = t.btnClearCloud;
      document.getElementById('summaryText').textContent = t.summaryText;
      document.getElementById('btnDedup').textContent = t.btnDedup;
      document.getElementById('langToggleBtn').textContent = lang === 'vi' ? 'EN' : 'VI';

      renderList();
    }

    function toggleLang() {
      applyLang(currentLang === 'vi' ? 'en' : 'vi');
    }

    const MAX_ITEMS = 5000;
    const MAX_CODE_LEN = 256;
    let codes = [];

    const listEl = document.getElementById('list');
    const countText = document.getElementById('countText');
    const btnDedup = document.getElementById('btnDedup');
    const statusEl = document.getElementById('statusText');
    const roomInput = document.getElementById('roomInput');
    const cameraSelect = document.getElementById('cameraSelect');
    const focusRing = document.getElementById('focusRing');
    const readerWrapper = document.getElementById('reader-wrapper');
    let html5QrCode = null;
    let videoTrack = null;
    let eventSource = null;
    let audioCtx = null;
    let isStarting = false;
    let currentZoom = 2;

    function showStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || 'var(--text-muted)';
      statusEl.style.fontWeight = color ? 'bold' : 'normal';
    }

    function sanitizeCode(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[\x00-\x1F\x7F]/g, '').trim().slice(0, MAX_CODE_LEN);
    }

    function generateSecureChannelName() {
      const randBytes = new Uint8Array(8);
      crypto.getRandomValues(randBytes);
      const hex = Array.from(randBytes).map(b => b.toString(16).padStart(2, '0')).join('');
      return `enscen-bc-${hex}`;
    }

    function initChannel() {
      let saved = localStorage.getItem('secure_channel_id');
      if (!saved || saved.trim() === 'enscen-barcode') {
        saved = generateSecureChannelName();
        localStorage.setItem('secure_channel_id', saved);
      }
      roomInput.value = saved;
    }

    function generateNewChannel() {
      const t = I18N[currentLang];
      if (!confirm(t.newChanPrompt)) return;
      const newChan = generateSecureChannelName();
      roomInput.value = newChan;
      localStorage.setItem('secure_channel_id', newChan);
      connectSSE();
      fetchFromChannel();
      showStatus(t.newChanDone, '#0969da');
    }

    function copyChannel() {
      const t = I18N[currentLang];
      navigator.clipboard.writeText(roomInput.value.trim()).then(() => {
        showStatus(t.copyDone, '#1a7f37');
      }).catch(() => {
        alert(roomInput.value.trim());
      });
    }

    function getTopic() {
      const val = (roomInput.value.trim() || 'enscen-barcode').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
      return val || 'enscen-barcode';
    }

    function playTone(freq, duration, gainVal) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.value = gainVal || 0.15;
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function playSuccessBeep() { playTone(950, 0.08, 0.15); }
    function playWarningBeep() {
      playTone(320, 0.1, 0.2);
      setTimeout(() => playTone(260, 0.12, 0.2), 120);
    }

    async function setZoom(val, btnEl) {
      currentZoom = val;
      document.querySelectorAll('.zoom-btns button').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      const video = document.querySelector('#reader video');
      const caps = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};

      if (caps.zoom) {
        try {
          const target = Math.min(Math.max(val, caps.zoom.min), caps.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
          if (video) video.style.transform = 'none';
          showStatus(`Zoom: ${target}x`);
          return;
        } catch (_) {}
      }

      if (video) {
        video.style.transform = val > 1 ? `scale(${val})` : 'none';
        showStatus(`Zoom: ${val}x`);
      }
    }

    async function triggerRefocus(e) {
      const t = I18N[currentLang];
      if (e && e.clientX) {
        const rect = readerWrapper.getBoundingClientRect();
        focusRing.style.left = `${e.clientX - rect.left}px`;
        focusRing.style.top = `${e.clientY - rect.top}px`;
        focusRing.classList.add('active');
        setTimeout(() => focusRing.classList.remove('active'), 500);
      }

      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.focusMode) {
        try {
          if (caps.focusMode.includes('single-shot')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          }
          if (caps.focusMode.includes('continuous')) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
          showStatus(t.refocused);
        } catch (_) {}
      }
    }

    readerWrapper.addEventListener('click', triggerRefocus);

    function hookVideoTrack() {
      const video = document.querySelector('#reader video');
      if (video && video.srcObject) {
        const [track] = video.srcObject.getVideoTracks();
        if (track) {
          videoTrack = track;
          setTimeout(() => {
            const btn2x = document.querySelector('.zoom-btns button:nth-child(3)');
            setZoom(2.0, btn2x);
          }, 400);
        }
      }
    }

    function flashExistingItem(codeText) {
      const items = listEl.querySelectorAll('li');
      items.forEach(li => {
        if (li.dataset.code === codeText) {
          li.style.backgroundColor = '#ffdce0';
          li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          setTimeout(() => { li.style.backgroundColor = ''; }, 1400);
        }
      });
    }

    let lastScanTime = 0;
    function onScanSuccess(rawDecodedText) {
      const now = Date.now();
      if (now - lastScanTime < 1200) return;
      lastScanTime = now;

      const t = I18N[currentLang];
      const decodedText = sanitizeCode(rawDecodedText);
      if (!decodedText) return;

      if (codes.includes(decodedText)) {
        playWarningBeep();
        if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
        showStatus(t.dupFound(decodedText), '#cf222e');
        flashExistingItem(decodedText);
        return;
      }

      if (codes.length >= MAX_ITEMS) {
        alert(t.maxLimit);
        return;
      }

      codes.push(decodedText);
      renderList();
      playSuccessBeep();
      if (navigator.vibrate) navigator.vibrate(80);
      showStatus(t.addedCode(decodedText), '#1a7f37');
    }

    const formatsToSupport = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.QR_CODE
    ];

    async function stopActiveStreams() {
      if (videoTrack) {
        try { videoTrack.stop(); } catch (_) {}
        videoTrack = null;
      }
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
        } catch (_) {}
      }
      document.querySelectorAll('#reader video').forEach(v => {
        if (v.srcObject) {
          try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (_) {}
          v.srcObject = null;
        }
      });
    }

    async function startScanner(cameraId) {
      if (isStarting) return;
      isStarting = true;
      const t = I18N[currentLang];
      showStatus(t.camSwitching);

      await stopActiveStreams();

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader", {
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            formatsToSupport: formatsToSupport
          });
        }

        const cameraConfig = cameraId
          ? { deviceId: { exact: cameraId } }
          : { facingMode: "environment" };

        await html5QrCode.start(
          cameraConfig,
          {
            fps: 20,
            qrbox: (w, h) => ({
              width: Math.floor(Math.min(w * 0.88, 360)),
              height: Math.floor(Math.min(h * 0.6, 140))
            }),
            aspectRatio: 1.777778
          },
          onScanSuccess,
          () => {}
        );

        showStatus(t.camReady);
        hookVideoTrack();
      } catch (err) {
        showStatus(t.camError + (err.message || err), '#cf222e');
      } finally {
        isStarting = false;
      }
    }

    async function onCameraChange(cameraId) {
      if (!cameraId) return;
      localStorage.setItem('preferred_camera_id', cameraId);
      await startScanner(cameraId);
    }

    async function initCameraList() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());

        const devices = await Html5Qrcode.getCameras();
        cameraSelect.innerHTML = '';
        if (!devices || !devices.length) {
          cameraSelect.innerHTML = '<option value="">No Camera</option>';
          await startScanner(null);
          return;
        }

        const savedId = localStorage.getItem('preferred_camera_id');
        let selectedId = devices[0].id;

        devices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.id;
          opt.textContent = dev.label || `Camera ${idx + 1}`;
          cameraSelect.appendChild(opt);

          const lbl = (dev.label || '').toLowerCase();
          if (lbl.includes('back') || lbl.includes('sau') || lbl.includes('zxhy') || lbl.includes('environment')) {
            selectedId = dev.id;
          }
        });

        if (savedId && devices.some(d => d.id === savedId)) {
          selectedId = savedId;
        }

        cameraSelect.value = selectedId;
        await startScanner(selectedId);
      } catch (err) {
        cameraSelect.innerHTML = '<option value="">Default Camera</option>';
        await startScanner(null);
      }
    }

    function renderList() {
      const t = I18N[currentLang];
      const freq = {};
      codes.forEach(c => freq[c] = (freq[c] || 0) + 1);

      let duplicateCount = 0;
      Object.values(freq).forEach(count => {
        if (count > 1) duplicateCount += (count - 1);
      });

      countText.innerHTML = '';
      const totalSpan = document.createElement('span');
      totalSpan.textContent = `${t.totalPrefix} ${codes.length}`;
      countText.appendChild(totalSpan);

      if (duplicateCount > 0) {
        const dupBadge = document.createElement('span');
        dupBadge.style.color = '#d1242f';
        dupBadge.style.fontWeight = 'bold';
        dupBadge.style.marginLeft = '4px';
        dupBadge.textContent = `(${duplicateCount} ${t.dupSuffix})`;
        countText.appendChild(dupBadge);
      }

      btnDedup.style.display = duplicateCount > 0 ? 'inline-block' : 'none';
      listEl.innerHTML = '';

      codes.slice().reverse().forEach((code, reversedIdx) => {
        const originalIdx = codes.length - 1 - reversedIdx;
        const isDup = freq[code] > 1;

        const li = document.createElement('li');
        li.dataset.code = code;
        if (isDup) li.className = 'duplicate-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'code-info';

        const indexB = document.createElement('b');
        indexB.textContent = `#${originalIdx + 1} `;

        const codeSpan = document.createElement('span');
        codeSpan.textContent = code;

        infoDiv.appendChild(indexB);
        infoDiv.appendChild(codeSpan);

        if (isDup) {
          const dupSpan = document.createElement('span');
          dupSpan.className = 'badge-dup';
          dupSpan.textContent = `${t.dupBadge} (${freq[code]}x)`;
          infoDiv.appendChild(dupSpan);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = t.delBtn;
        delBtn.onclick = () => removeCode(originalIdx);

        li.appendChild(infoDiv);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function removeCode(index) {
      codes.splice(index, 1);
      renderList();
    }

    function removeDuplicates() {
      const t = I18N[currentLang];
      if (!confirm(t.dedupPrompt)) return;
      codes = [...new Set(codes)];
      renderList();
      showStatus(t.dedupDone, '#1a7f37');
    }

    document.getElementById('btnSend').onclick = async () => {
      const t = I18N[currentLang];
      if (!codes.length) return alert(t.noCodesSend);
      const topic = getTopic();
      showStatus(t.sending);
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: codes.join('\n')
        });
        if (res.ok) {
          showStatus(t.sendSuccess(codes.length, topic), '#1a7f37');
        } else {
          showStatus(t.sendFail, '#cf222e');
        }
      } catch (e) {
        showStatus(`${I18N[currentLang].camError}${e.message}`, '#cf222e');
      }
    };

    async function fetchFromChannel() {
      const t = I18N[currentLang];
      const topic = getTopic();
      showStatus(t.fetching);
      try {
        const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1`);
        if (res.ok) {
          const text = await res.text();
          const lines = text.trim().split('\n').filter(Boolean);
          let latestMsg = null;
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const parsed = JSON.parse(lines[i]);
              if (parsed.event === 'message' && typeof parsed.message === 'string') {
                latestMsg = parsed.message;
                break;
              }
            } catch (_) {}
          }

          if (latestMsg === '__CLEAR__' || !latestMsg) {
            codes = [];
            renderList();
            showStatus(t.chanEmpty);
          } else {
            codes = latestMsg
              .split('\n')
              .map(s => sanitizeCode(s))
              .filter(Boolean)
              .slice(0, MAX_ITEMS);
            renderList();
            showStatus(t.receivedCodes(codes.length), '#1a7f37');
          }
        }
      } catch (e) {
        showStatus('Error fetching channel.', '#cf222e');
      }
    }

    document.getElementById('btnClearCloud').onclick = async () => {
      const t = I18N[currentLang];
      const topic = getTopic();
      if (!confirm(t.clearCloudPrompt(topic))) return;
      showStatus(t.sending);
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: '__CLEAR__'
        });
        if (res.ok) {
          codes = [];
          renderList();
          showStatus(t.clearedCloud, '#1a7f37');
        } else {
          showStatus('Error clearing Cloud.', '#cf222e');
        }
      } catch (e) {
        showStatus(`Error: ${e.message}`, '#cf222e');
      }
    };

    document.getElementById('btnClearLocal').onclick = () => {
      const t = I18N[currentLang];
      if (!confirm(t.clearLocalPrompt)) return;
      codes = [];
      renderList();
      showStatus(t.clearedLocal);
    };

    function connectSSE() {
      if (eventSource) eventSource.close();
      const topic = getTopic();
      const t = I18N[currentLang];
      eventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      eventSource.onopen = () => {
        showStatus(t.connectedSec);
      };
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && typeof data.message === 'string') {
            if (data.message === '__CLEAR__') {
              codes = [];
              renderList();
              showStatus(I18N[currentLang].wipedRemote);
              return;
            }
            codes = data.message
              .split('\n')
              .map(s => sanitizeCode(s))
              .filter(Boolean)
              .slice(0, MAX_ITEMS);
            renderList();
            showStatus(I18N[currentLang].receivedCodes(codes.length), '#1a7f37');
          }
        } catch (_) {}
      };
      eventSource.onerror = () => {
        showStatus(I18N[currentLang].lostNet, '#b54708');
      };
    }

    roomInput.onchange = () => {
      localStorage.setItem('secure_channel_id', roomInput.value.trim());
      connectSSE();
      fetchFromChannel();
    };

    document.getElementById('btnFetch').onclick = fetchFromChannel;

    document.getElementById('btnExport').onclick = () => {
      const t = I18N[currentLang];
      if (!codes.length) return alert(t.noCodes);
      const blob = new Blob([codes.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `barcodes_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    applyTheme(currentTheme);
    applyLang(currentLang);
    initChannel();
    initCameraList();
    fetchFromChannel();
    connectSSE();
  </script>
</body>
</html>
