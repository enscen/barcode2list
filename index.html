<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 0 auto; padding: 12px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    button { flex: 1 1 calc(50% - 8px); padding: 11px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 500; }
    button.primary { background: #0969da; color: #fff; border-color: #0969da; font-weight: bold; }
    button.success { background: #2da44e; color: #fff; border-color: #2c974b; font-weight: bold; }
    button.danger { background: #cf222e; color: #fff; border-color: #a40e26; }
    button.del-btn { flex: none; padding: 4px 8px; font-size: 12px; color: #cf222e; border: 1px solid #cf222e; border-radius: 4px; background: transparent; }
    .room-box { display: flex; align-items: center; gap: 8px; margin: 10px 0; padding: 8px 12px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; }
    .room-box input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
    .status { font-size: 13px; color: #555; padding: 6px 0; min-height: 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Quét Barcode</h2>
  <div id="reader"></div>

  <div class="room-box">
    <label for="roomInput"><b>Mã kênh:</b></label>
    <input type="text" id="roomInput" value="enscen-barcode">
  </div>

  <p>Tổng: <b id="count">0</b> mã</p>
  <div class="status" id="statusText">Trạng thái: Đang kết nối kênh...</div>

  <div class="btn-row">
    <button class="primary" id="btnSend">Gửi sang thiết bị khác</button>
    <button id="btnFetch">Nhận mã mới nhất</button>
    <button class="success" id="btnExport">Tải file TXT</button>
    <button class="danger" id="btnClear">Xóa tất cả</button>
  </div>

  <ul id="list"></ul>

  <script>
    // ponytail: ntfy.sh public topic. Upgrade path: private WebSocket / Supabase Realtime if end-to-end encryption required.
    let codes = [];
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('statusText');
    const roomInput = document.getElementById('roomInput');
    let eventSource = null;

    function getTopic() {
      return (roomInput.value.trim() || 'enscen-barcode').replace(/[^a-zA-Z0-9_-]/g, '');
    }

    function renderList() {
      countEl.textContent = codes.length;
      listEl.innerHTML = '';
      codes.forEach((code, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${idx + 1}. ${code}</span>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = 'Xóa';
        delBtn.onclick = () => removeCode(idx);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function removeCode(index) {
      codes.splice(index, 1);
      renderList();
    }

    function onScanSuccess(decodedText) {
      if (codes[codes.length - 1] === decodedText) return;
      codes.push(decodedText);
      renderList();
      if (navigator.vibrate) navigator.vibrate(100);
    }

    const scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: { width: 250, height: 150 } });
    scanner.render(onScanSuccess);

    // Gửi danh sách sang thiết bị khác (không cần token, lưu tạm cloud 12h)
    document.getElementById('btnSend').onclick = async () => {
      if (!codes.length) return alert('Chưa có mã nào để gửi.');
      const topic = getTopic();
      statusEl.textContent = 'Đang gửi...';
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: codes.join('\n')
        });
        if (res.ok) {
          statusEl.textContent = `Đã gửi thành công lên kênh [${topic}]`;
        } else {
          statusEl.textContent = 'Gửi thất bại, thử lại sau.';
        }
      } catch (e) {
        statusEl.textContent = `Lỗi mạng: ${e.message}`;
      }
    };

    // Nhận dữ liệu gần nhất từ kênh
    async function fetchFromChannel() {
      const topic = getTopic();
      statusEl.textContent = `Đang lấy dữ liệu từ kênh [${topic}]...`;
      try {
        const res = await fetch(`https://ntfy.sh/${topic}/raw?poll=1`);
        if (res.ok) {
          const text = await res.text();
          if (text.trim()) {
            codes = text.split('\n').map(s => s.trim()).filter(Boolean);
            renderList();
            statusEl.textContent = `Đã nhận ${codes.length} mã từ kênh [${topic}].`;
          } else {
            statusEl.textContent = 'Kênh chưa có mã nào.';
          }
        }
      } catch (e) {
        statusEl.textContent = 'Chưa thể lấy dữ liệu từ kênh.';
      }
    }

    // Tự động đồng bộ thời gian thực (SSE)
    function connectSSE() {
      if (eventSource) eventSource.close();
      const topic = getTopic();
      eventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      eventSource.onopen = () => {
        statusEl.textContent = `Đã kết nối kênh [${topic}]. Sẵn sàng đồng bộ.`;
      };
      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && data.message) {
            codes = data.message.split('\n').map(s => s.trim()).filter(Boolean);
            renderList();
            statusEl.textContent = `Nhận dữ liệu mới (${codes.length} mã)`;
          }
        } catch (_) {}
      };
      eventSource.onerror = () => {
        statusEl.textContent = 'Mất kết nối kênh thời gian thực, bấm "Nhận mã" để tải lại.';
      };
    }

    roomInput.onchange = () => {
      connectSSE();
      fetchFromChannel();
    };

    document.getElementById('btnFetch').onclick = fetchFromChannel;

    document.getElementById('btnExport').onclick = () => {
      if (!codes.length) return alert('Chưa có mã nào');
      const blob = new Blob([codes.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `barcodes_${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById('btnClear').onclick = () => {
      if (!confirm('Xóa toàn bộ danh sách hiện tại?')) return;
      codes = [];
      renderList();
    };

    fetchFromChannel();
    connectSSE();
  </script>
</body>
</html>
